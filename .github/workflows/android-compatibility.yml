name: Android compatibility matrix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: [26, 28, 30, 33, 35, 36, 37]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure compilation SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android and WebView scenarios
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            test "$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
            compat_full_flag=""
            if [ "${{ matrix.api }}" -ge 33 ]; then compat_full_flag="--require-full-ui"; fi
            adb -s emulator-5554 shell wm size 1080x1920
            adb -s emulator-5554 shell wm density 420
            python3 -B scripts/test_android_compat.py --run --serial emulator-5554 --label api${{ matrix.api }}-16x9 $compat_full_flag
            adb -s emulator-5554 shell wm size 1080x2400
            python3 -B scripts/test_android_compat.py --run --serial emulator-5554 --label api${{ matrix.api }}-20x9 $compat_full_flag
            if [ "${{ matrix.api }}" -ge 28 ]; then
              if adb -s emulator-5554 shell cmd overlay list | grep -q 'com.android.internal.display.cutout.emulation.corner'; then
                adb -s emulator-5554 shell cmd overlay enable --user 0 com.android.internal.display.cutout.emulation.corner
                python3 -B scripts/test_android_compat.py --run --serial emulator-5554 --label api${{ matrix.api }}-corner-cutout $compat_full_flag
                adb -s emulator-5554 shell cmd overlay disable --user 0 com.android.internal.display.cutout.emulation.corner
              else
                echo 'Cutout overlay unavailable in this system image; no cutout run claimed.'
              fi
            fi
      - name: Preserve numeric compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-api-${{ matrix.api }}-compatibility
          path: build/compatibility/
          if-no-files-found: warn
          retention-days: 14
