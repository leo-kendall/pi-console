name: Android compatibility matrix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        api: [26, 28, 30, 33, 35, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure compilation SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve space for API33 stock userdata
        if: ${{ matrix.api == 33 }}
        run: |
          set -euo pipefail
          test "${ANDROID_HOME:?}" = /usr/local/lib/android/sdk
          # API33's stock userdata needs 7.4 GB even with a smaller AVD setting.
          # This Java-only job does not use the hosted runner's NDK or .NET SDK.
          sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
          df -h "$ANDROID_HOME"
      - name: Actual Android and WebView scenarios
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # Tiny default AVDs clamp wm overrides; use a 1080x1920 base display.
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          # Request a small data partition; reserve space above for stock images
          # whose minimum userdata image is larger. Tests themselves use <50 MiB.
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_android_compat_matrix.sh ${{ matrix.api }}
      - name: Preserve numeric compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-api-${{ matrix.api }}-compatibility
          path: build/compatibility/
          if-no-files-found: warn
          retention-days: 14
