name: Checks and Android development build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Python regressions
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B -m unittest discover -s remote-desktop -p 'test_*.py'
      - name: Java and JavaScript regressions
        run: |
          python3 -B scripts/test_java.py
          node tests/test_app_state.cjs
          node tests/test_desktop_layout.cjs
          node tests/test_webview_readiness.cjs
          node tests/test_android_compat_transport.cjs
          node tests/test_desktop_diagnostics.cjs
          node tests/test_desktop_edge_probe.cjs
          node tests/test_observability_ui.cjs
          python3 -B scripts/test_file_engine.py
          python3 -B scripts/test_file_native.py
          python3 -B scripts/test_file_service.py
          for file in android/assets/*.js; do node --check "$file"; done
      - name: Check publishable source set
        run: python3 -B scripts/check_release.py
      - name: Browser regressions with simulated data
        run: python3 -B scripts/test_browser.py
  android:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ensure Android SDK components
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Android linkage regressions
        run: |
          python3 -B scripts/test_client_native_java.py
          PI_ANDROID_JAR="${ANDROID_HOME}/platforms/android-35/android.jar" python3 -B tests/run_desktop_java.py
      - name: Build development APK
        run: python3 -B scripts/build_android.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-console-development-apk
          path: build/pi-console-debug.apk
          retention-days: 7
          if-no-files-found: error
